name: Sync Skylight Meals

# Mirrors the upcoming school lunches into the Skylight Meals planner.
# Each run pushes the next ~35 days, so weekly keeps a comfortable buffer.
on:
  schedule:
    - cron: "0 11 * * 0" # Sundays 11:00 UTC (~5-6am Central)
  workflow_dispatch: {} # allow manual runs from the Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/sync-skylight.mjs
        env:
          SKYLIGHT_EMAIL: ${{ secrets.SKYLIGHT_EMAIL }}
          SKYLIGHT_PASSWORD: ${{ secrets.SKYLIGHT_PASSWORD }}
          FEEDS: ${{ secrets.FEEDS }}
          TIMEZONE: America/Chicago
